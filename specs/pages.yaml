schema_version: 1
status: "approved-baseline-from-user-reference"
rules:
  fixed_inventory: true
  fixed_sidebar_order: true
  routes_must_be_unique: true
  every_page_must_have_acceptance_criteria: true
  locale_aware: true
  supports_rtl_ltr: true
  customer_reorder_allowed: false
sidebar:
  - home
  - overview
  - systems
  - landscape
  - alerts-events
  - performance
  - jobs-processes
  - database
  - transports
  - security
  - backup-recovery
  - reports
  - settings
pages:
  - id: home
    route: /
    label_key: nav.home
    status: "visual-baseline-defined"
    acceptance:
      - "Uses the Home dashboard grid defined in docs/VISUAL_ARCHITECTURE.md."
      - "Fixture data is visibly labeled DEMO and has data quality states."
      - "All UI content is localized for English and Persian."
  - id: overview
    route: /overview
    label_key: nav.overview
    status: "layout-defined-in-docs-ISLANDS_VISUAL_SPEC-source-field-validation-pending"
    spec_ref: "docs/ISLANDS_VISUAL_SPEC.md#island-10-system-operations"
    acceptance:
      - "Route resolves with correct active navigation state."
      - "Page content is localized in both supported locales."
      - "Operational issues link to authoritative detail pages and preserve filters."
      - "No parallel health formula or unsupported causal inference."
  - id: systems
    route: /systems
    label_key: nav.systems
    status: "navigation-defined-layout-pending"
    acceptance: ["Route resolves with correct active navigation state.", "Page content is localized in both supported locales."]
  - id: landscape
    route: /landscape
    label_key: nav.landscape
    status: "navigation-defined-layout-pending"
    acceptance: ["Route resolves with correct active navigation state.", "Page content is localized in both supported locales."]
  - id: alerts-events
    route: /alerts-events
    label_key: nav.alertsEvents
    status: "navigation-defined-layout-pending"
    acceptance: ["Route resolves with correct active navigation state.", "Page content is localized in both supported locales."]
  - id: performance
    route: /performance
    label_key: nav.performance
    status: "navigation-defined-layout-pending"
    acceptance: ["Route resolves with correct active navigation state.", "Page content is localized in both supported locales."]
  - id: jobs-processes
    route: /jobs-processes
    label_key: nav.jobsProcesses
    status: "source-mapped-prototype-created; integrated-route-pending"
    spec_ref: "docs/SM37_SOURCE_FIELD_MAPPING.md"
    prototype_ref: "prototypes/sm37-home-to-detail.html"
    integrity_ref: "docs/CROSS_PAGE_DATA_INTEGRITY_VALIDATION.md#sm37-concrete-checks"
    acceptance:
      - "Route resolves with correct active navigation state in the integrated app."
      - "Page content is localized in English and Persian with correct RTL/LTR behavior."
      - "Home deep link preserves supported filters and DEMO data state."
      - "Read-only table displays only mapped source fields; missing fields remain Unknown."
      - "Status counts/charts remain disabled until unique row identity and mapping are validated."
      - "No execution controls are available in Phase 1."
  - id: database
    route: /database
    label_key: nav.database
    status: "navigation-defined-layout-pending"
    acceptance: ["Route resolves with correct active navigation state.", "Page content is localized in both supported locales."]
  - id: transports
    route: /transports
    label_key: nav.transports
    status: "navigation-defined-layout-pending"
    acceptance: ["Route resolves with correct active navigation state.", "Page content is localized in both supported locales."]
  - id: security
    route: /security
    label_key: nav.security
    status: "navigation-defined-layout-pending"
    acceptance: ["Route resolves with correct active navigation state.", "Page content is localized in both supported locales."]
  - id: backup-recovery
    route: /backup-recovery
    label_key: nav.backupRecovery
    status: "navigation-defined-layout-pending"
    acceptance: ["Route resolves with correct active navigation state.", "Page content is localized in both supported locales."]
