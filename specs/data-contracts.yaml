schema_version: 1
status: "conventions-approved-source-mappings-pending"
provenance:
  required_when_data_is_displayed:
    - source_id
    - observed_at
    - quality
    - freshness
  timezone_required: true
  unit_required_for_quantities: true
quality_values:
  - valid
  - partial
  - invalid
  - unknown
freshness_values:
  - fresh
  - stale
  - unknown
data_modes:
  - DEMO
  - LIVE
rules:
  - "LIVE is permitted only after the source and mapping are validated."
  - "DEMO must be visible in the UI and fixture metadata."
  - "Missing or invalid provenance must not silently default to healthy."
  - "Partial results must be labeled and must not masquerade as complete."
  - "Timeouts and source failures must produce explicit error/stale states."
  - "The UI must not invent values to fill gaps."
generic_record_fields:
  source_id: "string"
  observed_at: "ISO-8601 timestamp with timezone"
  quality: "valid | partial | invalid | unknown"
  freshness: "fresh | stale | unknown"
  mode: "DEMO | LIVE"
# This is a convention scaffold, not a substitute for a service-specific schema.

# Service-specific contracts are added only after source fields are inspected.
# Application-level names below are proposed names, not SM37 PDF column headers.
contracts:
  background_job:
    status: "SM37 source labels confirmed from user upload; row identity and status normalization pending"
    source_artifact: "user-upload: SM37.md"
    report_scope:
      from_date_raw: "1405/07/25"
      to_date_raw: "1405/07/26"
      reported_records_passed: 8062
    confirmed_source_labels: ["JobName", "Job CreatedBy", "Status", "Start date", "Start Time", "Duration(sec.)", "Delay", "Cli", "Reason for Delay", "Spool", "Job doc"]
    observed_status_labels: ["Finished", "Canceled", "Released", "Scheduled"]
    field_rules:
      - "No stable job-run identifier, system ID, target server, end time, capture time or timezone is evidenced."
      - "Preserve raw Jalali date/time; do not infer timezone or convert calendar."
      - "Delay unit and meaning are unknown."
      - "Do not enable counts/charts until row identity, duplicate handling, status mapping and extraction alignment are validated."
      - "Any fixture rows from the upload must be labeled DEMO, never LIVE."
    fields:
      job_name:
        source_label: "JobName"
        type: string
        status: "field-confirmed"
      job_created_by:
        source_label: "Job CreatedBy"
        type: string
        status: "field-confirmed-label"
      job_status_raw:
        source_label: "Status"
        type: string
        status: "field-confirmed"
      job_status_normalized:
        type: string
        status: "mapping-pending"
        allowed_values: [scheduled, released, ready, running, finished, canceled, unknown]
      start_date_raw:
        source_label: "Start date"
        type: string
        status: "field-confirmed"
      start_time_raw:
        source_label: "Start Time"
        type: string
        status: "field-confirmed"
      duration_seconds_raw:
        source_label: "Duration(sec.)"
        type: string
        status: "label-confirmed; column alignment pending"
      delay_raw:
        source_label: "Delay"
        type: string
        status: "label-confirmed; unit unknown"
      client_raw:
        source_label: "Cli"
        type: string
        status: "label-confirmed"
      reason_for_delay:
        source_label: "Reason for Delay"
        type: string
        status: "label-confirmed; row values incomplete"
      spool:
        source_label: "Spool"
        type: string
        status: "label-confirmed; row values pending"
      job_document:
        source_label: "Job doc"
        type: string
        status: "label-confirmed; row values pending"
      record_id:
        type: string
        status: "not-source-confirmed"
        rule: "A derived DEMO locator may be used for selection, never presented as native SAP job ID."
      observed_at:
        type: string
        status: "not-provided"

  user_preferences:
    status: "proposed-local-UI-preferences-contract; implementation pending"
    source: "local application preferences only; no SAP dependency"
    sensitivity: "non-sensitive settings only"
    fields:
      locale: {type: "enum", allowed_values: ["en", "fa"], default: "en"}
      direction: {type: "derived enum", allowed_values: ["ltr", "rtl"], rule: "Derived from locale; en=ltr, fa=rtl"}
      theme: {type: "enum", allowed_values: ["light", "dark", "system"], default: "system"}
      font_family: {type: "string", rule: "Must be from approved bundled/system-safe font list"}
      font_scale: {type: "number", rule: "Must be clamped to approved accessible range"}
      density: {type: "enum", allowed_values: ["comfortable", "compact"], default: "comfortable"}
      content_layout: {type: "enum", allowed_values: ["standard", "wide", "focused"], default: "standard"}
      high_contrast: {type: "boolean", default: false}
      reduced_motion: {type: "enum", allowed_values: ["on", "off", "system"], default: "system"}
      landing_page: {type: "string", default: "home", rule: "Must resolve to an implemented route"}
      default_time_window: {type: "string", rule: "Applied only where supported by the page"}
      refresh_interval: {type: "string", rule: "No live polling implied in Phase 1"}
      data_mode_preference: {type: "enum", allowed_values: ["DEMO"], rule: "LIVE cannot be selected by preference alone"}
    rules:
      - "Persist only if the chosen local persistence mechanism is implemented; otherwise label settings session-only."
      - "Never include credentials, tokens, cookies or secrets."
      - "Preference changes must not alter source values, KPI formulas, fixed navigation order or Home baseline."
  connection_profile:
    status: "proposed-local-metadata-contract; disconnected in MVP"
    source: "user-entered local configuration; no network requests in Phase 1"
    sensitivity: "profile metadata only; no credentials"
    fields:
      profile_name: {type: "string", required: true}
      environment_label: {type: "enum", allowed_values: ["development", "quality", "production", "other"]}
      sid: {type: "string", required: false}
      client: {type: "string", required: false}
      connection_type: {type: "enum", allowed_values: ["application_server", "message_server"]}
      application_server_host: {type: "string", required: false}
      message_server_host: {type: "string", required: false}
      message_server_group: {type: "string", required: false}
      instance_number: {type: "string", required: false}
      saprouter_route: {type: "string", required: false}
      authentication_mode: {type: "string", required: false}
      notes: {type: "string", required: false, rule: "Must not contain secrets"}
      state: {type: "enum", allowed_values: ["CONFIGURED_NOT_CONNECTED"]}
    rules:
      - "Locally valid configuration is not proof of connectivity."
      - "No Test Connection, Connect or Activate Live Data action in MVP."
      - "Never persist credentials or make SAP network requests."
