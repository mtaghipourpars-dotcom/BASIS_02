schema_version: 1
status: "conventions-approved-source-mappings-pending"
provenance:
  required_when_data_is_displayed:
    - source_id
    - observed_at
    - quality
    - freshness
  timezone_required: true
  unit_required_for_quantities: true
quality_values:
  - valid
  - partial
  - invalid
  - unknown
freshness_values:
  - fresh
  - stale
  - unknown
data_modes:
  - DEMO
  - LIVE
rules:
  - "LIVE is permitted only after the source and mapping are validated."
  - "DEMO must be visible in the UI and fixture metadata."
  - "Missing or invalid provenance must not silently default to healthy."
  - "Partial results must be labeled and must not masquerade as complete."
  - "Timeouts and source failures must produce explicit error/stale states."
  - "The UI must not invent values to fill gaps."
generic_record_fields:
  source_id: "string"
  observed_at: "ISO-8601 timestamp with timezone"
  quality: "valid | partial | invalid | unknown"
  freshness: "fresh | stale | unknown"
  mode: "DEMO | LIVE"
# This is a convention scaffold, not a substitute for a service-specific schema.

# Service-specific contracts are added only after source fields are inspected.
# Application-level names below are proposed names, not SM37 PDF column headers.
contracts:
  background_job:
    status: "SM37 source labels confirmed from user upload; row identity and status normalization pending"
    source_artifact: "user-upload: SM37.md"
    report_scope:
      from_date_raw: "1405/07/25"
      to_date_raw: "1405/07/26"
      reported_records_passed: 8062
    confirmed_source_labels: ["JobName", "Job CreatedBy", "Status", "Start date", "Start Time", "Duration(sec.)", "Delay", "Cli", "Reason for Delay", "Spool", "Job doc"]
    observed_status_labels: ["Finished", "Canceled", "Released", "Scheduled"]
    field_rules:
      - "No stable job-run identifier, system ID, target server, end time, capture time or timezone is evidenced."
      - "Preserve raw Jalali date/time; do not infer timezone or convert calendar."
      - "Delay unit and meaning are unknown."
      - "Do not enable counts/charts until row identity, duplicate handling, status mapping and extraction alignment are validated."
      - "Any fixture rows from the upload must be labeled DEMO, never LIVE."
    fields:
      job_name:
        source_label: "JobName"
        type: string
        status: "field-confirmed"
      job_created_by:
        source_label: "Job CreatedBy"
        type: string
        status: "field-confirmed-label"
      job_status_raw:
        source_label: "Status"
        type: string
        status: "field-confirmed"
      job_status_normalized:
        type: string
        status: "mapping-pending"
        allowed_values: [scheduled, released, ready, running, finished, canceled, unknown]
      start_date_raw:
        source_label: "Start date"
        type: string
        status: "field-confirmed"
      start_time_raw:
        source_label: "Start Time"
        type: string
        status: "field-confirmed"
      duration_seconds_raw:
        source_label: "Duration(sec.)"
        type: string
        status: "label-confirmed; column alignment pending"
      delay_raw:
        source_label: "Delay"
        type: string
        status: "label-confirmed; unit unknown"
      client_raw:
        source_label: "Cli"
        type: string
        status: "label-confirmed"
      reason_for_delay:
        source_label: "Reason for Delay"
        type: string
        status: "label-confirmed; row values incomplete"
      spool:
        source_label: "Spool"
        type: string
        status: "label-confirmed; row values pending"
      job_document:
        source_label: "Job doc"
        type: string
        status: "label-confirmed; row values pending"
      record_id:
        type: string
        status: "not-source-confirmed"
        rule: "A derived DEMO locator may be used for selection, never presented as native SAP job ID."
      observed_at:
        type: string
        status: "not-provided"
